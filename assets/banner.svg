<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Dynamic Styles / Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.12); }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(0px); opacity: 0.05; }
        50% { opacity: 0.15; }
        100% { transform: translateY(420px); opacity: 0.05; }
      }
      @keyframes dashDrift {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 120; }
      }

      .bg-pulse-1 {
        transform-origin: 200px 100px;
        animation: pulseAura 8s ease-in-out infinite alternate;
      }
      .bg-pulse-2 {
        transform-origin: 1000px 300px;
        animation: pulseAura 10s ease-in-out infinite alternate 1s;
      }
      .floating-device-left {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-device-right {
        animation: floatOpposite 8s ease-in-out infinite;
      }
      .dynamic-dash {
        stroke-dasharray: 6 10;
        animation: dashDrift 14s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" />
  </g>

  <!-- Dynamic Glowing Ambient Orbs (Strictly in Background) -->
  <circle class="bg-pulse-1" cx="220" cy="110" r="180" fill="url(#glowGrad1)" filter="url(#softGlow)"/>
  <circle class="bg-pulse-2" cx="980" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#softGlow)"/>

  <!-- Connecting Dynamic Data Lines (Strictly in Background) -->
  <path class="dynamic-dash" d="M150 350 C 300 380, 450 310, 600 340 C 750 370, 900 290, 1050 330" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
  <path class="dynamic-dash" d="M100 80 C 280 40, 520 100, 700 60 C 880 20, 1020 90, 1120 70" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.25"/>

  <!-- Animated Floating Mobile Device Outlines on Sides (Framing the Banner, leaving center 100% clear) -->
  <!-- Left Side: Smartphone Wireframe -->
  <g class="floating-device-left" opacity="0.45" transform="translate(60, 90)">
    <rect x="0" y="0" width="110" height="210" rx="20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Speaker & Camera -->
    <line x1="42" y1="12" x2="68" y2="12" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="78" cy="12" r="2.5" fill="#64748b"/>
    <!-- Mock UI Blocks -->
    <rect x="12" y="32" width="86" height="40" rx="6" fill="#0284c7" opacity="0.3"/>
    <rect x="12" y="82" width="40" height="45" rx="6" fill="#818cf8" opacity="0.25"/>
    <rect x="58" y="82" width="40" height="45" rx="6" fill="#818cf8" opacity="0.25"/>
    <rect x="12" y="136" width="86" height="50" rx="6" fill="#64748b" opacity="0.2"/>
  </g>

  <!-- Right Side: Tablet / Large Display Wireframe -->
  <g class="floating-device-right" opacity="0.45" transform="translate(1020, 90)">
    <rect x="0" y="0" width="120" height="210" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- App UI Mock -->
    <rect x="14" y="24" width="92" height="24" rx="4" fill="#a855f7" opacity="0.3"/>
    <rect x="14" y="58" width="92" height="70" rx="6" fill="#6366f1" opacity="0.25"/>
    <rect x="14" y="138" width="42" height="50" rx="4" fill="#38bdf8" opacity="0.25"/>
    <rect x="64" y="138" width="42" height="50" rx="4" fill="#ec4899" opacity="0.2"/>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges & Tags (Always in front & crystal clear) -->

  <!-- Top Pill / Category Badge -->
  <g transform="translate(600, 78)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="-145" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="badge-text" x="-130" y="4" text-anchor="start">TOP MOBILE DEV TOOLS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text class="title-text" x="600" y="155" text-anchor="middle">
    Awesome Mobile Development Tools
  </text>

  <!-- Accent Gradient Underline -->
  <rect x="420" y="174" width="360" height="4" rx="2" fill="url(#primaryGrad)"/>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="215" text-anchor="middle">
    Curated Frameworks, Native Toolchains, Build Automation &amp; Cloud DevOps
  </text>
  <text class="subtitle-text" x="600" y="242" text-anchor="middle" font-size="16" fill="#64748b">
    iOS · Android · Flutter · React Native · Expo · Kotlin Multiplatform · Fastlane · CI/CD
  </text>

  <!-- Foreground Pill Tags -->
  <g transform="translate(600, 315)">
    <!-- Tag 1: Flutter & React Native -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle">⚡ Cross-Platform</text>
    </g>

    <!-- Tag 2: iOS & Android Native -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle">🍎 Native iOS &amp; 🤖 Android</text>
    </g>

    <!-- Tag 3: Build & CI/CD -->
    <g transform="translate(15, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle">🚀 CI/CD &amp; Automation</text>
    </g>

    <!-- Tag 4: Testing & Telemetry -->
    <g transform="translate(210, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle">🧪 Testing &amp; Quality</text>
    </g>

    <!-- Tag 5: Cloud SaaS -->
    <g transform="translate(370, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle">☁️ Mobile SaaS</text>
    </g>
  </g>

  <!-- Sleek Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>
</svg>